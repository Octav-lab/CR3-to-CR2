<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR3 to CR2 - Data Link</title>
    
    <!-- Content Security Policy pentru protecție XSS -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline';">
    
    <!-- Tailwind CSS pentru design responsiv rapid -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JSZip pentru crearea arhivei ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Tematica Matrix / Minimalistă */
        :root {
            --matrix-dark: #050505;
            --matrix-olive: #556B2F;       /* Verde olive inchis */
            --matrix-olive-light: #6B8E23; /* Verde olive mai deschis pentru hover */
            --matrix-glow: rgba(107, 142, 35, 0.4);
        }

        body {
            background-color: var(--matrix-dark);
            color: var(--matrix-olive);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ascundem scrollbar-ul pentru un aspect mai curat */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--matrix-dark); }
        ::-webkit-scrollbar-thumb { background: var(--matrix-olive); border-radius: 4px; }

        .btn-matrix {
            background-color: transparent;
            color: var(--matrix-olive);
            border: 2px solid var(--matrix-olive);
            padding: 12px 24px;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--matrix-glow);
            border-radius: 4px;
        }

        .btn-matrix:hover {
            background-color: var(--matrix-olive);
            color: var(--matrix-dark);
            box-shadow: 0 0 20px var(--matrix-olive-light);
        }

        .input-matrix {
            background-color: transparent;
            color: var(--matrix-olive-light);
            border: 1px solid var(--matrix-olive);
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            width: 100%;
            max-width: 300px;
        }

        .input-matrix:focus {
            box-shadow: 0 0 10px var(--matrix-glow);
        }

        /* Animație Upload */
        .upload-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--matrix-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px var(--matrix-olive-light); }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--matrix-glow); }
        }

        /* Tubul de transfer */
        .tube-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
            min-height: 200px;
        }

        .tube {
            width: 80%;
            height: 4px;
            background-color: rgba(85, 107, 47, 0.2);
            position: relative;
            border-radius: 2px;
            overflow: hidden;
        }

        .data-packet {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 20px;
            background-color: var(--matrix-olive-light);
            box-shadow: 0 0 15px 5px var(--matrix-olive-light);
            opacity: 0;
        }

        .animating-packet {
            animation: moveData 1.5s ease-in-out forwards;
        }

        @keyframes moveData {
            0% { left: 0; opacity: 1; }
            80% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px dashed rgba(85, 107, 47, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            word-break: break-all;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        .file-size {
            white-space: nowrap;
            margin-left: 10px;
            opacity: 0.8;
            font-size: 0.75rem;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Modal Eroare */
        #errorModal {
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #050505;
            border: 2px solid #8b0000; /* Roșu închis pentru eroare */
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }
        .text-error {
            color: #ff4444;
        }
        .btn-error {
            border-color: #8b0000;
            color: #ff4444;
        }
        .btn-error:hover {
            background-color: #8b0000;
            color: white;
        }
    </style>
</head>
<body>

    <!-- MODAL EROARE -->
    <div id="errorModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 p-4">
        <div class="modal-content p-6 max-w-sm w-full text-center rounded">
            <h2 class="text-error text-xl font-bold mb-4">SYSTEM_ERROR</h2>
            <p id="errorMessage" class="text-error mb-6 text-sm">Fișier invalid detectat.</p>
            <button onclick="closeError()" class="btn-matrix btn-error text-sm px-6 py-2 w-full">REBOOT_SYSTEM (Închide)</button>
        </div>
    </div>

    <!-- ECRAN 1: UPLOAD -->
    <div id="uploadView" class="flex-1 flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <h1 class="text-3xl md:text-5xl font-bold mb-8 tracking-widest text-center">DATA_LINK_PROTOCOL</h1>
        <p class="mb-12 opacity-75 text-center max-w-md text-sm md:text-base">
            Sistem pregătit. Atașați fișierele RAW (.CR3 / .CR2). Protocoalele de conversie a numelor vor fi inițiate automat.
        </p>
        
        <label for="fileInput" class="btn-matrix upload-pulse flex items-center justify-center text-center">
            [ INIȚIAZĂ UPLOAD ]
        </label>
        <input type="file" id="fileInput" multiple accept=".cr3,.cr2" class="hidden" onchange="handleFiles(event)">
    </div>

    <!-- ECRAN 2: PROCESARE (Split Screen) -->
    <div id="processingView" class="hidden flex-1 flex flex-col md:flex-row w-full h-full p-2 md:p-8 overflow-hidden gap-4 transition-opacity duration-500">
        
        <!-- Stânga: Fisiere Initiale (CR3) -->
        <div class="flex-1 border border-[var(--matrix-olive)] rounded p-4 flex flex-col h-1/3 md:h-full overflow-hidden">
            <h2 class="text-center border-b border-[var(--matrix-olive)] pb-2 mb-4 font-bold">SOURCE_DATA [.CR3]</h2>
            <div id="sourceList" class="overflow-y-auto flex-1 pr-2">
                <!-- Aici apar fișierele incarcate -->
            </div>
        </div>

        <!-- Mijloc: Tub Animatie -->
        <div class="w-full md:w-32 h-24 md:h-full flex-shrink-0 relative">
            <div class="tube-container flex-col md:flex-row">
                <div class="tube md:w-full md:h-4 w-4 h-full">
                    <div id="dataPacket" class="data-packet hidden md:block"></div>
                    <!-- Pentru mobil (tub vertical) avem nevoie de un packet adaptat -->
                    <div id="dataPacketMobile" class="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-8 bg-[var(--matrix-olive-light)] shadow-[0_0_15px_5px_var(--matrix-olive-light)] opacity-0 hidden md:hidden"></div>
                </div>
            </div>
        </div>

        <!-- Dreapta: Fisiere Convertite (CR2) -->
        <div class="flex-1 border border-[var(--matrix-olive)] rounded p-4 flex flex-col h-1/3 md:h-full overflow-hidden relative">
            <h2 class="text-center border-b border-[var(--matrix-olive)] pb-2 mb-4 font-bold">TARGET_DATA [.CR2]</h2>
            <div id="targetList" class="overflow-y-auto flex-1 pr-2">
                <!-- Aici apar fișierele convertite -->
            </div>
            
            <!-- Zona de Download (Apare la final) -->
            <div id="downloadOverlay" class="absolute inset-0 bg-[var(--matrix-dark)]/90 backdrop-blur-sm hidden flex-col items-center justify-center p-6 text-center">
                <h3 class="text-xl mb-4 text-[var(--matrix-olive-light)] font-bold">PROTOCOL_COMPLET</h3>
                
                <div class="w-full flex flex-col items-center gap-4 mb-6">
                    <label class="text-sm opacity-80">Nume Arhivă ZIP:</label>
                    <input type="text" id="zipName" value="Pachet_Date_CR2" class="input-matrix text-center" placeholder="nume_arhivă">
                </div>
                
                <button onclick="downloadZip()" id="downloadBtn" class="btn-matrix w-full max-w-[250px] mb-4">
                    [ DOWNLOAD ZIP ]
                </button>
                
                <!-- NOU: Butonul de BACK -->
                <button onclick="resetApp()" class="btn-matrix w-full max-w-[250px] text-sm py-2 opacity-70 hover:opacity-100" style="border-style: dashed;">
                    < SYSTEM_RESTART (Înapoi) >
                </button>
            </div>
        </div>
    </div>

    <script>
        let processedFiles = [];
        let zip = null;

        // Utilitar pentru afișarea dimensiunii în MB
        function formatBytesToMB(bytes) {
            const mb = bytes / (1024 * 1024);
            return mb.toFixed(2) + ' MB';
        }

        // Afișare Modal Eroare
        function showError(message) {
            document.getElementById('errorMessage').innerText = message;
            document.getElementById('errorModal').classList.remove('hidden');
        }

        // Închidere Modal Eroare
        function closeError() {
            document.getElementById('errorModal').classList.add('hidden');
        }

        // NOU: Funcția de resetare a aplicației (Back button)
        function resetApp() {
            // Curăță datele din memorie
            processedFiles = [];
            zip = null;
            document.getElementById('fileInput').value = ''; // Resetează input-ul file
            
            // Curăță listele vizuale
            document.getElementById('sourceList').innerHTML = '';
            document.getElementById('targetList').innerHTML = '';
            
            // Ascunde overlay-ul de download și ecranul de procesare
            document.getElementById('downloadOverlay').classList.add('hidden');
            document.getElementById('downloadOverlay').classList.remove('flex');
            
            document.getElementById('processingView').classList.add('hidden');
            
            // Reafișează ecranul de upload
            document.getElementById('uploadView').classList.remove('hidden');
            
            // Resetează textul butonului de download
            document.getElementById('downloadBtn').innerText = '[ DOWNLOAD ZIP ]';
            document.getElementById('downloadBtn').disabled = false;
        }

        // Funcția principală care se execută la selectarea fișierelor
        async function handleFiles(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            // VALIDARE: Verificăm dacă toate fișierele sunt .cr3 sau .cr2
            for (let i = 0; i < files.length; i++) {
                const fileName = files[i].name.toLowerCase();
                if (!fileName.endsWith('.cr3') && !fileName.endsWith('.cr2')) {
                    showError(`Fișier nepermis: ${files[i].name}\nDoar extensiile .CR3 și .CR2 sunt acceptate.`);
                    event.target.value = ''; // Respingem selecția
                    return;
                }
            }

            processedFiles = files;
            zip = new JSZip();

            // Trecem la UI-ul de procesare
            document.getElementById('uploadView').classList.add('hidden');
            document.getElementById('processingView').classList.remove('hidden');
            document.getElementById('processingView').classList.add('flex'); // pentru a forta flex layout-ul

            const sourceList = document.getElementById('sourceList');
            const targetList = document.getElementById('targetList');
            const packetDesktop = document.getElementById('dataPacket');
            const packetMobile = document.getElementById('dataPacketMobile');

            // Setăm animația specifică (desktop = stânga-dreapta, mobil = sus-jos)
            const isMobile = window.innerWidth < 768;
            
            // CSS custom pentru animația pe verticală (mobil) injectat dinamic
            if (isMobile) {
                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes moveDataMobile {
                        0% { top: 0; opacity: 1; }
                        80% { opacity: 1; }
                        100% { top: 100%; opacity: 0; }
                    }
                    .animating-packet-mobile {
                        animation: moveDataMobile 1.2s ease-in-out forwards;
                        display: block !important;
                    }
                `;
                document.head.appendChild(style);
            }

            // Procesăm fiecare fișier cu o mică întârziere pentru efectul vizual
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const originalName = file.name;
                const sizeStr = `[${formatBytesToMB(file.size)}]`;
                
                // Schimbăm extensia indiferent dacă era cr3, devine sigur cr2 (sau ramane cr2)
                const newName = originalName.substring(0, originalName.lastIndexOf('.')) + '.CR2';

                // Adăugăm în arhiva ZIP datele brute ale fișierului sub noul nume
                zip.file(newName, file);

                // 1. Adăugăm în lista Sursă
                const sourceEl = document.createElement('div');
                sourceEl.className = 'file-item';
                sourceEl.innerHTML = `<span>> ${originalName}</span> <span class="file-size">${sizeStr}</span>`;
                sourceList.appendChild(sourceEl);
                sourceList.scrollTop = sourceList.scrollHeight;

                // 2. Declanșăm animația prin tub
                if (isMobile) {
                    packetMobile.classList.remove('animating-packet-mobile');
                    void packetMobile.offsetWidth; // trigger reflow
                    packetMobile.classList.add('animating-packet-mobile');
                } else {
                    packetDesktop.classList.remove('animating-packet');
                    void packetDesktop.offsetWidth; // trigger reflow
                    packetDesktop.classList.add('animating-packet');
                }

                // Așteptăm puțin pentru a simula timpul de transfer
                await new Promise(r => setTimeout(r, 600));

                // 3. Adăugăm în lista Țintă
                const targetEl = document.createElement('div');
                targetEl.className = 'file-item';
                targetEl.style.color = 'var(--matrix-olive-light)';
                targetEl.innerHTML = `<span>> ${newName}</span> <span class="file-size">${sizeStr}</span>`;
                targetList.appendChild(targetEl);
                targetList.scrollTop = targetList.scrollHeight;

                await new Promise(r => setTimeout(r, 400));
            }

            // Procesare finalizată, afișăm meniul de Download
            setTimeout(() => {
                document.getElementById('downloadOverlay').classList.remove('hidden');
                document.getElementById('downloadOverlay').classList.add('flex');
            }, 500);
        }

        // Generarea și descărcarea arhivei
        async function downloadZip() {
            const btn = document.getElementById('downloadBtn');
            const nameInput = document.getElementById('zipName').value || 'Pachet_Date_CR2';
            
            btn.innerText = '[ SE COMPILEAZĂ... ]';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                // Generam fișierul zip asincron
                const content = await zip.generateAsync({
                    type: "blob",
                    compression: "STORE" // Fara compresie pentru viteza maxima (pozele raw oricum nu se comprima bine)
                });

                // Creăm un link temporar pentru a forța descărcarea
                const url = URL.createObjectURL(content);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${nameInput}.zip`;
                document.body.appendChild(a);
                a.click();
                
                // Curățăm
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    btn.innerText = '[ SUCCES ]';
                }, 100);

            } catch (error) {
                console.error("Eroare la generare ZIP:", error);
                showError("SYSTEM_FAULT: Eroare la compilarea arhivei. Verificați memoria disponibilă.");
                btn.innerText = '[ EROARE CRITICĂ ]';
            }
        }
    </script>
</body>
</html>
